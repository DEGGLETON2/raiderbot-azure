name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - 'devin/*'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Build-time environment variables
          NODE_ENV: production

      - name: Install API dependencies
        run: npm install --prefix ./build/server --omit=dev

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # App location - root of the SvelteKit app (per adapter docs)
          app_location: "./"
          # API location - Azure Functions for SSR (adapter creates build/server)
          api_location: "build/server"
          # Output location - where the built static files are (adapter creates build/static)
          output_location: "build/static"
          # Skip API build since we already built it with npm run build
          skip_api_build: true
        env:
          # Skip Oryx build since we already built everything
          SKIP_BUILD: "true"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
